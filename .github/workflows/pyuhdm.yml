name: pyuhdm

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]

jobs:
  build:
    name: ${{ matrix.os }} | Python v${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10"]

    steps:
    - name: Install system dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake g++-11 ninja-build

    - name: Checkout repository (with submodules)
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        architecture: 'x64'

    - name: Install Python build dependencies and setup artifact name
      run: |
        python -m pip install --upgrade pip
        python -m pip install build pybind11 pytest scikit-build-core wheel

    - name: Editable install (Linux)
      if: runner.os == 'Linux'
      shell: bash
      env:
        CC: gcc-11
        CXX: g++-11
      run: |
        env
        which cmake && cmake --version
        which ninja && ninja --version
        which $CC && $CC --version
        which $CXX && $CXX --version
        which python && python --version

        python -m pip install -e .

    - name: Editable install (Windows)
      if: runner.os == 'Windows'
      shell: cmd
      env:
        CC: cl
        CXX: cl
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        if %errorlevel% neq 0 exit /b %errorlevel%

        set
        where cmake && cmake --version
        where ninja && ninja --version
        where %CC% && %CC%
        where %CXX% && %CXX%
        where python && python --version

        python -m pip install -e .

    - name: Verify import 
      run: python -c "import pyuhdm; print(pyuhdm); print(pyuhdm.__file__);"

    - name: Build wheel (Linux)
      if: runner.os == 'Linux'
      shell: bash
      env:
        CC: gcc-11
        CXX: g++-11
      run: |
        env
        which cmake && cmake --version
        which ninja && ninja --version
        which $CC && $CC --version
        which $CXX && $CXX --version
        which python && python --version

        python -m pip wheel . --no-deps

    - name: Build wheel (Windows)
      if: runner.os == 'Windows'
      shell: cmd
      env:
        CC: cl
        CXX: cl
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        if %errorlevel% neq 0 exit /b %errorlevel%

        set
        where cmake && cmake --version
        where ninja && ninja --version
        where %CC% && %CC%
        where %CXX% && %CXX%
        where python && python --version

        python -m pip wheel . --no-deps

    - name: Run tests (skip VpiListener)
      run: pytest -v -k "not VpiListener"

    - name: Setup artifact name
      shell: bash
      run: echo "artifact-name=$(ls *.whl | head -n 1)" >> $GITHUB_ENV

    - name: Archive artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.artifact-name }}
        path: ${{ env.artifact-name }}
